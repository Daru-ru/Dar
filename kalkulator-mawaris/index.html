<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Mawaris</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 75px auto 75px;
      height: 100vh;
      row-gap: 2em;
      background-color: #f8f8f8;
    }

    .header {
      background-color: #fff;
      border-bottom: 1px solid #e5e5e5;
      display: grid;
      place-content: center;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 2em;

      @media all and (max-width: 700px) {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        row-gap: 2em;
      }
    }


    #jumlahHarta {
      max-width: 200px;
    }



    .jumlah {
      display: none;
      width: 3em;
    }

    .jumlahLabel {
      display: none;
    }

    .form-group {
      display: grid;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 8px;
      background-color: #F9F6EE;
      row-gap: 6px;
    }

    .form-group > :first-child {
      font-size: 1.2em;
      font-weight: 600;
    }

    .form-group > div {
      margin: 5px;
    }

    .input-container {
      display: grid;
      row-gap: 2em;
      width: 90%;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      margin: auto;
      background-color: #fff;
      padding: 16px;
    }

    .result-container {
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    .result-container > div {
      background-color: #fff;
      position: sticky;
      top: 5px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      min-height: 150px;
      padding: 26px;
    }

    #hasilMawaris {
      margin: auto;
    }

    .radio-container {
      display: grid;
    }

    table {
      border-collapse: collapse;
      border: 2px solid rgb(200 200 200);
      letter-spacing: 1px;
      font-size: 1.1em;
    }

    td,
    th {
      border: 1px solid rgb(190 190 190);
      padding: 10px 20px;
    }

    #calculate {
      height: 36px;
      font-weight: 600;
      background-color: #f9eecf;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      transition: background-color 0.25s ease, border-color 0.25s ease, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
    }

    #calculate:hover {
      background-color: #f9eecf;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    #calculate:active {
      background-color: #f9eecf;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
    }

    footer {
      background-color: #fff;
      border-bottom: #e5e5e5;
      display: grid;
      place-content: center;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Kalkulator Mawaris</h1>
  </header>
  <main class="main">
    
    <section class="input-container">

      <div class="form-group">
        <label for="jumlahHarta">jumlah harta</label>
        <input type="number" id="jumlahHarta" min="1" value="1">
      </div>
      
        
    </section>

    
    <section class="result-container">
      <div>
        <table id="hasilMawaris">
          <tr>
            <th>Muhaqqi</th>
            <th>Bagian</th>
          </tr>
        </table>
      </div>
      
    </section>
    
  </main>
  <footer class="footer"><h1>.....</h1></footer>
  
  <script type="module">

          hasil["saudariYB"]["asabah"] = true;

        }

        //untuk kakek dan saudariY (tanpa saudaraY)

          // lanjut sebagai asabah

          delete hasil["saudariY"]["frac"];
        }

        //isu jika ternyata 1/3 lebih besar dari asabah, apakah anak pr 
        //mendapat bagian secara asabah atau 2/3? ya, meskipun kelihatannya hasilnya tetap sama, hanya takut ada edge cases.

          hasil["kakekY"]["asabah"] = false;
          hasil["kakekY"]["frac"] = {pembilang: 1, penyebut: 3};
        }
        
      }

      // jad maal ikhwah ketika ada ahlu fard lain 
      if(muhaqqiHidup.includes("kakekY") && 
          (muhaqqiHidup.includes("saudaraYB") || muhaqqiHidup.includes("saudaraY") || muhaqqiHidup.includes("saudariYB") || muhaqqiHidup.includes("saudariY"))
        ) {

          console.log("blok")

          for (const item in hasil) {
            if(item == "kakekY" || item == "saudaraYB" || item == "saudariYB" || item == "saudaraY" || item == "saudariY") continue;
            if(hasil[item].bagian !== null) {

          }

          console.log(hartaBagian);
          let hartaAsabah = harta - hartaBagian;

          if (hartaBagian <= harta / 2) {

            let jmlhSaudari = 0;
            if (muhaqqiHidup.includes("saudaraYB")) {
              jmlhSaudara += hasil["saudaraYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudaraY")) {
              jmlhSaudara += hasil["saudaraY"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariYB")) {
              jmlhSaudari += hasil["saudariYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariY")) {
              jmlhSaudari += hasil["saudariY"]["jumlah"];
            }

            if(jmlhSaudara * 2 + jmlhSaudari <= 4) {

              hasil["kakekY"]["asabah"] = false;

            }
          }

          if (hartaBagian == harta * 2 / 3) {
            console.log("lebih kecil sama dengan setengah harta")
            let jmlhSaudara = 0;
            let jmlhSaudari = 0;
            if (muhaqqiHidup.includes("saudaraYB")) {
              jmlhSaudara += hasil["saudaraYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudaraY")) {
              jmlhSaudara += hasil["saudaraY"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariYB")) {
              jmlhSaudari += hasil["saudariYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariY")) {
              jmlhSaudari += hasil["saudariY"]["jumlah"];
            }

            if(jmlhSaudari == 1) {

              delete hasil["kakekY"]["frac"];
              hasil["kakekY"]["bagian"] = null;
            } else {
              hasil["kakekY"]["bagian"] = harta / 6;
              hasil["kakekY"]["asabah"] = false;
              hasil["kakekY"]["frac"] = {pembilang: 1, penyebut: 6,}
            }
          }

          if (hartaBagian > harta / 2 && hartaBagian < harta * 2 / 3 ) {
            console.log("lebih kecil sama dengan setengah harta")
            let jmlhSaudara = 0;
            let jmlhSaudari = 0;
            if (muhaqqiHidup.includes("saudaraYB")) {
              jmlhSaudara += hasil["saudaraYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudaraY")) {
              jmlhSaudara += hasil["saudaraY"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariYB")) {
              jmlhSaudari += hasil["saudariYB"]["jumlah"];
            }
            if (muhaqqiHidup.includes("saudariY")) {
              jmlhSaudari += hasil["saudariY"]["jumlah"];
            }

            if(jmlhSaudara * 2 + jmlhSaudari <= 2) {
              console.log("lanjut sebagai asabah")
              delete hasil["kakekY"]["frac"];
              hasil["kakekY"]["bagian"] = null;
            } else {
              hasil["kakekY"]["bagian"] = harta / 6;
              hasil["kakekY"]["asabah"] = false;
              hasil["kakekY"]["frac"] = {pembilang: 1, penyebut: 6,}
            }
          }

          console.log(hartaBagian, hartaAsabah)

          if(hartaBagian >= harta || hartaAsabah <= harta / 6 ) {
            hasil["kakekY"]["bagian"] = harta / 6;
            hasil["kakekY"]["asabah"] = false;
            hasil["kakekY"]["frac"] = {pembilang: 1, penyebut: 6,}

      let hartaBagian = 0;

      for (const item in hasil) {

          hartaBagian += hasil[item].bagian;
        }
      }

      let hartaAsabah = harta - hartaBagian;

      console.log(hartaAsabah)

      if(Math.abs(harta - hartaBagian) < 0.000001){
        hartaAsabah = 0;
      }

      

      for (const item in hasil) {
        if(hasil[item]["jk"] == "lk" && hasil[item]["asabah"] == true) {
          muhaqqiAsabah.jumlahLk += hasil[item]["jumlah"];
        } else if(hasil[item]["jk"] == "pr" && hasil[item]["asabah"] == true && item == "ibu") {

        }

      if (hartaAsabah < 0) {

        hartaAsabah = 0;

      if(muhaqqiHidup.includes("kakekY") && hasil["kakekY"]["asabah"] == true && (muhaqqiHidup.includes("saudaraYB") || muhaqqiHidup.includes("saudaraY"))) {
        hasil["kakekY"]["bagian"] = (hasilAsabah["bagianLk"] / muhaqqiAsabah["jumlahLk"]);

        if(muhaqqiHidup.includes("kakekY") && hasil["kakekY"]["asabah"] == true && (muhaqqiHidup.includes("saudaraYB") || muhaqqiHidup.includes("saudaraY"))) {

    function anakLk (jumlah, harta, muhaqqiHidup) {
      if(muhaqqiHidup.indexOf("saudaraYB") >= 0) {
        muhaqqiHidup.splice(muhaqqiHidup.indexOf("saudaraYB"),1)
      }

      if(muhaqqiHidup.indexOf("saudariYB") >= 0) {
        muhaqqiHidup.splice(muhaqqiHidup.indexOf("saudariYB"),1)
      }

      if(muhaqqiHidup.indexOf("saudaraY") >= 0) {
        muhaqqiHidup.splice(muhaqqiHidup.indexOf("saudaraY"),1)
      }

      if(muhaqqiHidup.indexOf("saudariY") >= 0) {
        muhaqqiHidup.splice(muhaqqiHidup.indexOf("saudariY"),1)
      }

      if(muhaqqiHidup.indexOf("keponakanYB") >= 0) {
        muhaqqiHidup.splice(muhaqqiHidup.indexOf("keponakanYB"),1)
      }

      if(muhaqqiHidup.indexOf("keponakanY") >= 0) {

    function asabah(listAsabah, hartaAsabah) {
      const asabahLk = listAsabah.jumlahLk;
      const asabahPr = listAsabah.jumlahPr;
      let bagianLk = 0;
      let bagianPr = 0;
      let hasil = {}

      if(asabahPr > 0) {
        hasil["bagianLk"] = hartaAsabah / (asabahLk * 2 + asabahPr) * 2 * asabahLk ;
        hasil["bagianPr"] = hartaAsabah / (asabahLk * 2 + asabahPr) * asabahPr;
      } else {
        hasil["bagianLk"] = hartaAsabah ;
      }
      return hasil;
    }

    function aul(hasil, harta) {
      let pen = [];
      
      for(const item in hasil) {
        if(hasil[item]["asabah"] !== true) {
          pen.push(hasil[item]["frac"]["penyebut"])
        }
      }

      let KPK = pen.reduce((acc, num) => lcm(acc,num));

      for(const item in hasil) {
        if(hasil[item]["asabah"] !== true) {
          hasil[item]["frac"]["pembilang"] *=  (KPK / hasil[item]["frac"]["penyebut"]);
        }
      }

      let amb = 0;

      for (const item in hasil) {
        if(hasil[item]["asabah"] !== true) {
          amb += hasil[item]["frac"]["pembilang"]
        }
      }

      for (const item in hasil) {
        if(hasil[item]["asabah"] !== true) {
          hasil[item]["frac"]["penyebut"] = amb;
        }
      }

      for (const item in hasil) {
        if(hasil[item]["asabah"] !== true) {
          hasil[item]["bagian"] = harta * hasil[item]["frac"]["pembilang"] / hasil[item]["frac"]["penyebut"];
        }
      }
    }

    function rad(hasil, muhaqqiHidup, harta) {
      let berhaqRad = muhaqqiHidup.filter(item => item !== "istri" && item !== "suami");
      console.log(berhaqRad);

      if (!muhaqqiHidup.includes("istri") && !muhaqqiHidup.includes("suami")) {
        if(berhaqRad.length == 1) {
          hasil[berhaqRad[0]]["bagian"] = harta;
        } else {

          for(const item in hasil) {
            pen.push(hasil[item]["frac"]["penyebut"])
          }

          let KPK = pen.reduce((acc, num) => lcm(acc,num));

          for(const item in hasil) {

          }

          let jumlahSahm = 0;

          for (const item in hasil) {
            jumlahSahm += hasil[item]["frac"]["pembilang"];
          }

          for (const item in hasil) {
            hasil[item]["frac"]["penyebut"] = jumlahSahm;
          }

          for (const item in hasil) {
            hasil[item]["bagian"] = harta * hasil[item]["frac"]["pembilang"] / hasil[item]["frac"]["penyebut"];
          }

        }
      }

      if (muhaqqiHidup.includes("istri") || muhaqqiHidup.includes("suami")) {
        let hartaRad;
        if(muhaqqiHidup.includes("istri")) {
          hartaRad = harta - hasil["istri"]["bagian"];

        if (muhaqqiHidup.includes("suami")) {

        }

        console.log(hartaRad);

        if (berhaqRad.length == 1) {
          hasil[berhaqRad[0]]["bagian"] = hartaRad;
        } else {
          let pen = [];
      
          for(const item in hasil) {
            if (berhaqRad.includes(item)) {
              pen.push(hasil[item]["frac"]["penyebut"])
            }
          }

          let KPK = pen.reduce((acc, num) => lcm(acc,num));

          for(const item in hasil) {
            if (berhaqRad.includes(item)) {
              hasil[item]["frac"]["pembilang"] *=  (KPK / hasil[item]["frac"]["penyebut"]);
            }
          }

          let jumlahSahm = 0;

          for (const item in hasil) {
            if (berhaqRad.includes(item)) {
              jumlahSahm += hasil[item]["frac"]["pembilang"];
            }
          }

          for (const item in hasil) {
            if (berhaqRad.includes(item)) {
              hasil[item]["frac"]["penyebut"] = jumlahSahm;
            }
          }

          for (const item in hasil) {
            if (berhaqRad.includes(item)) {
              hasil[item]["bagian"] = hartaRad * hasil[item]["frac"]["pembilang"] / hasil[item]["frac"]["penyebut"];
            }
          }
        }
      }
    }
